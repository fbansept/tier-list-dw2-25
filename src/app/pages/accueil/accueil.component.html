<div class="d-flex">
  <input [(ngModel)]="urlSaisie" />
  <div (click)="onAjoutImage()" class="bouton">Ajouter l'image</div>
</div>

<div class="d-flex">
  <input [(ngModel)]="nomCategorieSaisie" />
  <div (click)="onAjoutCategorie()" class="bouton">Ajouter la categorie</div>
</div>

<div class="liste-categories">
  @for (
    categorie of listeCategorie;
    track indexCategorie;
    let indexCategorie = $index
  ) {
    <app-categorie
      [categorie]="categorie"
      [afficheBoutonPlus]="indexCategorie != 0"
      [afficheBoutonMoins]="indexCategorie != listeCategorie.length - 1"
      (clickSuppressionImage)="onClicSupprimeImage(indexCategorie, $event)"
      (clickDeplacerImage)="
        onClicDeplacementImage(
          indexCategorie,
          $event.indexImage,
          $event.direction
        )
      "
    ></app-categorie>
  }
</div>
